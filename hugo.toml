baseURL = 'https://fanhhh.top/'
languageCode = 'zh-cn'
title = "Fanhhh's blog"
theme = 'PaperMod'

sectionPagesMenu = "main"

[outputs]
    home = ["HTML", "RSS", "JSON"]

[params]
    description = "Fanhhh的技术与生活记录"
    # 核心设置：auto 表示跟随系统，light 为浅色，dark 为深色
    defaultTheme = "auto"
    showCodeCopyButtons = true
    comments = true
    
    # --- 文章元数据 ---
    showPostMeta = true
    showReadingTime = true
    showWordCount = true

    # --- 扩展参数 (需配合你的代码修改生效) ---
    [params.busuanzi]
        enable = true

    [params.twikoo]
        enable = true
        envId = 'https://comment.fanhhh.top' 

    [params.homeInfoParams]
        Title = "Welcome👋"
        Content = "这里提供一些关于技术的话题，崇尚自由，欢迎大家自由留言。联系博主qq更快得到帮助3020939106（大号）、2929416262（小号），小号不常登，可加大号，以及最近用校园网翻墙避免不了被抓到，但是听说可以用桂电和师大的账号登录，大家可以试试"
            
    [[params.socialIcons]]
        name = "github"
        url = "https://github.com/Fax-han"

# --- 菜单设置 ---
[menu]
    [[menu.main]]
        identifier = "archives"
        name = "文章列表"
        url = "/archives"
        weight = 20
    
    [[menu.main]]
        identifier = "tags"
        name = "标签"
        url = "/tags"
        weight = 30

    [[menu.main]]
        identifier = "search"
        name = "搜索"
        url = "/search"
        weight = 40

    # --- Google Analytics 设置 ---
    [services]
        [services.googleAnalytics]
            ID = 'G-DPGSLJPVYV'
